[project]
name = "ap-investigator"
version = "1.0.0"
description = "AI-assisted Accounts Payable invoice investigation: AI handles ambiguity, deterministic Python handles financial correctness."
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "B008", "UP037"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
